services:
  # 1. Background Worker (BullMQ + Redis)
  - type: worker
    name: judgeweb-worker
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        sync: false
      - key: JUDGE0_CLOUD_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. Backend API
  - type: web
    name: judgeweb-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        sync: false
      - key: JUDGE0_CLOUD_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 3. Frontend React App
  - type: web
    name: judgeweb-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: judgeweb-api
          envVarKey: RENDER_EXTERNAL_URL
